server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Floor-plan analysis can legitimately take several minutes.
    # Nginx's default proxy_read_timeout is only 60s, which disconnects
    # the browser while Next.js is still waiting for the vision pipeline.
    proxy_connect_timeout 10s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;

    # Pass analysis responses through immediately and avoid buffering a
    # long-running JSON response in the reverse proxy.
    proxy_buffering off;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Floor-plan uploads are handled by the application.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
