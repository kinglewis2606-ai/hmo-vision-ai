name: Build and Runtime Smoke Test

on:
  push:
    branches: [main, hmo-production, hmo-pipeline-v2, fix/real-floorplan-pipeline, fix/max-hmo-geometry-output, hmo-max-conversion]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:geometry
      - name: Test HMO planner property-specific optimisation
        run: |
          rm -rf .hmo-planner-test
          tsc --ignoreConfig tests/hmoPlanner.test.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-planner-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-planner-test/tests/hmoPlanner.test.js
      - name: Test reference-style HMO layout pipeline
        run: |
          rm -rf .hmo-layout-test
          tsc --ignoreConfig tests/hmoLayoutPipeline.test.ts lib/hmoLayoutPipeline.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-layout-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-layout-test/tests/hmoLayoutPipeline.test.js
      - name: Test source-dependent HMO outcome
        run: |
          rm -rf .hmo-source-test
          tsc --ignoreConfig tests/hmoPipelineSmoke.test.ts lib/hmoLayoutPipeline.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-source-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-source-test/tests/hmoPipelineSmoke.test.js
      - run: npm run build
      - name: Start production server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: file:/tmp/coachhub-smoke.db
          COACHHUB_COACH_SIGNUP_CODE: smoke-coach-code
        run: |
          npx prisma migrate deploy
          nohup npm run start -- -H 127.0.0.1 -p 3000 >/tmp/hmo-next.log 2>&1 &
          echo $! >/tmp/hmo-next.pid
      - name: Wait for server
        run: |
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:3000/ >/tmp/home.html && exit 0; sleep 1; done
          cat /tmp/hmo-next.log
          exit 1
      - name: Verify pages and API boundaries
        run: |
          for path in / /login /dashboard /matches /communication /players /player /player/register /parent /parent/request; do curl --fail --silent http://127.0.0.1:3000${path} >/tmp/page.html; grep -q '<body' /tmp/page.html; done
          curl --fail --silent http://127.0.0.1:3000/api/coachhub/public >/tmp/public.json
          test "$(curl --silent --output /tmp/a --write-out '%{http_code}' http://127.0.0.1:3000/api/coachhub)" = 403
          test "$(curl --silent --output /tmp/a --write-out '%{http_code}' http://127.0.0.1:3000/api/coachhub/parent)" = 403
          test "$(curl --silent --output /tmp/a --write-out '%{http_code}' http://127.0.0.1:3000/api/coachhub/player)" = 403
      - name: Verify authenticated Coach and Parent flow
        run: |
          coach="coach-$(date +%s)-$RANDOM@example.com"
          parent="parent-$(date +%s)-$RANDOM@example.com"
          curl --fail --silent -c /tmp/coach.cookies -X POST -H 'Content-Type: application/json' -d "{\"role\":\"COACH\",\"email\":\"$coach\",\"password\":\"SmokeCoach123!\",\"coachCode\":\"smoke-coach-code\"}" http://127.0.0.1:3000/api/auth/register >/tmp/coach.json
          curl --fail --silent -c /tmp/parent.cookies -X POST -H 'Content-Type: application/json' -d "{\"role\":\"PARENT\",\"email\":\"$parent\",\"password\":\"SmokeParent123!\"}" http://127.0.0.1:3000/api/auth/register >/tmp/parent.json
          curl --fail --silent -b /tmp/coach.cookies http://127.0.0.1:3000/api/coachhub >/tmp/coachhub.json
          curl --fail --silent -b /tmp/parent.cookies -X POST -H 'Content-Type: application/json' -d '{"action":"request","parentName":"Smoke Parent","childFirstName":"Jack","childLastName":"Thompson"}' http://127.0.0.1:3000/api/coachhub/access-requests >/tmp/request.json
          id=$(node -p "require('/tmp/request.json').request.id")
          curl --fail --silent -b /tmp/coach.cookies -X POST -H 'Content-Type: application/json' -d "{\"id\":\"$id\",\"status\":\"APPROVED\"}" http://127.0.0.1:3000/api/coachhub/access-requests >/tmp/approved.json
          curl --fail --silent -b /tmp/parent.cookies http://127.0.0.1:3000/api/coachhub/parent >/tmp/parent-api.json
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/coachhub.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/parent-api.json','utf8'));
          if(c.team?.name!=='Caversham Falcons U10s'||c.players?.length<10||c.events?.length<2)throw Error('Coach seed data missing');
          if(p.child?.firstName!=='Jack'||p.child?.lastName!=='Thompson'||Array.isArray(p.players))throw Error('Parent child boundary failed');
          console.log('Authenticated Coach/Parent flow and child boundary verified');
          NODE
      - name: Verify secure player invite and player isolation
        run: |
          player_id=$(node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/coachhub.json'));process.stdout.write(b.players[0].id)")
          curl --fail --silent --show-error -b /tmp/coach.cookies -X POST -H 'Content-Type: application/json' -d "{\"playerId\":\"$player_id\"}" http://127.0.0.1:3000/api/coachhub/player-invites >/tmp/player-invite.json
          code=$(node -p "require('/tmp/player-invite.json').inviteCode")
          curl --fail --silent --show-error -c /tmp/player.cookies -X POST -H 'Content-Type: application/json' -d "{\"code\":\"$code\",\"email\":\"player-$(date +%s)-$RANDOM@example.com\",\"password\":\"SmokePlayer123!\"}" http://127.0.0.1:3000/api/auth/player-register >/tmp/player-register.json
          curl --fail --silent --show-error -b /tmp/player.cookies http://127.0.0.1:3000/api/coachhub/player >/tmp/player-api.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/player-api.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/coachhub.json','utf8'));
          if(!p.player?.id||p.player.id!==c.players[0].id)throw Error('Player invite did not bind the correct player');
          if(Array.isArray(p.players))throw Error('Player API leaked squad list');
          const other=c.players.find(x=>x.id!==p.player.id);
          if(!other)throw Error('Second player missing');
          fs.writeFileSync('/tmp/other-player-id',other.id);
          fs.writeFileSync('/tmp/player-event-id',p.events[0].id);
          console.log('Player account and isolation verified');
          NODE
          status=$(curl --silent --output /tmp/player-cross.json --write-out '%{http_code}' -b /tmp/player.cookies -X POST -H 'Content-Type: application/json' -d "{\"action\":\"availability\",\"eventId\":\"$(cat /tmp/player-event-id)\",\"status\":\"AVAILABLE\"}" http://127.0.0.1:3000/api/coachhub/player)
          test "$status" = 200
          status=$(curl --silent --output /tmp/player-cross.json --write-out '%{http_code}' -b /tmp/player.cookies -X POST -H 'Content-Type: application/json' -d "{\"action\":\"availability\",\"eventId\":\"$(cat /tmp/player-event-id)\",\"playerId\":\"$(cat /tmp/other-player-id)\",\"status\":\"AVAILABLE\"}" http://127.0.0.1:3000/api/coachhub)
          test "$status" = 403
      - name: Verify availability poll
        run: |
          node - <<'NODE'
          const fs=require('fs'),http=require('http');
          const b=JSON.parse(fs.readFileSync('/tmp/coachhub.json','utf8')),e=b.events[0],p=b.players[0];
          const cookie=fs.readFileSync('/tmp/coach.cookies','utf8').split('\n').find(x=>x.includes('coachhub_session')).split('\t').pop();
          const post=s=>new Promise((ok,no)=>{const d=JSON.stringify({action:'availability',eventId:e.id,playerId:p.id,status:s});const q=http.request({hostname:'127.0.0.1',port:3000,path:'/api/coachhub',method:'POST',headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(d),Cookie:'coachhub_session='+cookie}},r=>{r.resume();r.on('end',()=>ok(r.statusCode))});q.on('error',no);q.write(d);q.end()});
          (async()=>{if(await post('AVAILABLE')!==200||await post('UNAVAILABLE')!==200||await post('MAYBE')!==400)throw Error('Availability poll failed');console.log('Availability poll verified: YES/NO only')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify upload API is reachable
        run: |
          printf 'x' > /tmp/smoke.txt
          status=$(curl --silent --output /tmp/upload.json --write-out '%{http_code}' -X POST -F 'file=@/tmp/smoke.txt;type=text/plain' http://127.0.0.1:3000/api/upload)
          test "$status" = 400
          grep -Eq 'Unsupported file type|No file uploaded' /tmp/upload.json
      - name: Verify analysis API initializes
        run: |
          status=$(curl --silent --output /tmp/analyse.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/analyse)
          test "$status" = 400
          grep -Eq 'No uploaded file|Invalid uploaded filename|Missing' /tmp/analyse.json
      - name: Verify server remains alive
        run: kill -0 $(cat /tmp/hmo-next.pid)
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hmo-next.log || true
      - name: Stop production server
        if: always()
        run: kill $(cat /tmp/hmo-next.pid) 2>/dev/null || true
