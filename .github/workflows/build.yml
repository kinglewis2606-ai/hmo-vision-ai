# CoachHub build and runtime acceptance test.
name: Build and Runtime Smoke Test

on:
  push:
    branches:
      - main
      - hmo-production
      - hmo-pipeline-v2
      - fix/real-floorplan-pipeline
      - fix/max-hmo-geometry-output
      - hmo-max-conversion
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:geometry
      - name: Test HMO planner property-specific optimisation
        run: |
          rm -rf .hmo-planner-test
          tsc --ignoreConfig tests/hmoPlanner.test.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-planner-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-planner-test/tests/hmoPlanner.test.js
      - name: Test reference-style HMO layout pipeline
        run: |
          rm -rf .hmo-layout-test
          tsc --ignoreConfig tests/hmoLayoutPipeline.test.ts lib/hmoLayoutPipeline.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-layout-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-layout-test/tests/hmoLayoutPipeline.test.js
      - name: Test source-dependent HMO outcome
        run: |
          rm -rf .hmo-source-test
          tsc --ignoreConfig tests/hmoPipelineSmoke.test.ts lib/hmoLayoutPipeline.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-source-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-source-test/tests/hmoPipelineSmoke.test.js
      - run: npm run build
      - name: Start production server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: file:/tmp/coachhub-smoke.db
        run: |
          npx prisma migrate deploy
          nohup npm run start -- -H 127.0.0.1 -p 3000 > /tmp/hmo-next.log 2>&1 &
          echo $! > /tmp/hmo-next.pid
      - name: Wait for production server
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/hmo-next.log
          exit 1
      - name: Verify CoachHub pages render
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html
          grep -q "CoachHub" /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/dashboard > /tmp/dashboard.html
          grep -q "What needs doing?" /tmp/dashboard.html
          curl --fail --silent --show-error http://127.0.0.1:3000/matches > /tmp/matches.html
          grep -q "Match" /tmp/matches.html
          curl --fail --silent --show-error http://127.0.0.1:3000/communication > /tmp/communication.html
          grep -q "Team communication" /tmp/communication.html
          curl --fail --silent --show-error http://127.0.0.1:3000/players > /tmp/players.html
          grep -q "Players" /tmp/players.html
          curl --fail --silent --show-error http://127.0.0.1:3000/player > /tmp/player.html
          grep -q "Player view" /tmp/player.html
          curl --fail --silent --show-error http://127.0.0.1:3000/parent > /tmp/parent.html
          grep -q "Parent view\|Parent" /tmp/parent.html
      - name: Verify CoachHub API and seeded team
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/coachhub > /tmp/coachhub.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/coachhub.json','utf8'));
          if (!body.team || body.team.name !== 'Caversham Falcons U10s') throw new Error('CoachHub team seed missing');
          if (!Array.isArray(body.players) || body.players.length < 10) throw new Error('CoachHub player seed missing');
          if (!Array.isArray(body.events) || body.events.length < 2) throw new Error('CoachHub event seed missing');
          console.log(JSON.stringify({team:body.team.name,players:body.players.length,events:body.events.length,feedback:body.feedback?.length || 0,messages:body.messages?.length || 0}, null, 2));
          NODE
      - name: Verify parent entitlement boundary
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/coachhub/parent > /tmp/parent-api.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/parent-api.json','utf8'));
          if (body.entitlements?.role !== 'PARENT') throw new Error('Parent role missing');
          if (body.entitlements?.canViewOtherPlayers !== false) throw new Error('Parent can view other players');
          if (!body.child || !body.child.id) throw new Error('Parent child profile missing');
          if (Array.isArray(body.players)) throw new Error('Parent endpoint leaked squad list');
          for (const event of body.events || []) {
            for (const item of event.availability || []) if (item.playerId !== body.child.id) throw new Error('Parent event availability leaked another player');
            for (const item of event.selections || []) if (item.playerId !== body.child.id) throw new Error('Parent match selection leaked another player');
          }
          console.log('Parent data boundary verified for child:', body.child.firstName, body.child.lastName);
          NODE
      - name: Verify upload API is reachable
        run: |
          printf 'x' > /tmp/smoke.txt
          status=$(curl --silent --output /tmp/upload.json --write-out "%{http_code}" -X POST -F 'file=@/tmp/smoke.txt;type=text/plain' http://127.0.0.1:3000/api/upload)
          test "$status" = "400"
          grep -Eq 'Unsupported file type|No file uploaded' /tmp/upload.json
      - name: Verify analysis API initializes
        run: |
          status=$(curl --silent --output /tmp/analyse.json --write-out "%{http_code}" -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/analyse)
          test "$status" = "400"
          grep -Eq 'No uploaded file|Invalid uploaded filename|Missing' /tmp/analyse.json
      - name: Verify server remains alive
        run: kill -0 $(cat /tmp/hmo-next.pid)
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hmo-next.log || true
      - name: Stop production server
        if: always()
        run: kill $(cat /tmp/hmo-next.pid) 2>/dev/null || true
