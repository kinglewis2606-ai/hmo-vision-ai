name: Build and Runtime Smoke Test

on:
  push:
    branches:
      - fix/real-floorplan-pipeline
      - fix/max-hmo-geometry-output
      - fix/hmo-production-recovery
      - fix/analysis-timeout-recovery
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:geometry
      - run: npm run build
      - name: Validate production Nginx configuration
        run: |
          bash scripts/validate-nginx-config.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          mkdir -p /tmp/nginx-smoke/conf /tmp/nginx-smoke/logs /tmp/nginx-smoke/client_body_temp
          cat > /tmp/nginx-smoke/nginx.conf <<'EOF'
          pid /tmp/nginx-smoke/nginx.pid;
          error_log /tmp/nginx-smoke/logs/error.log;
          events {}
          http {
            include /etc/nginx/mime.types;
            access_log /tmp/nginx-smoke/logs/access.log;
            include /home/runner/work/hmo-vision-ai/hmo-vision-ai/deploy/nginx/hmo-vision-ai.conf;
          }
          EOF
          nginx -t -c /tmp/nginx-smoke/nginx.conf -p /tmp/nginx-smoke
      - name: Start production server
        run: |
          nohup npm run start -- -H 127.0.0.1 -p 3000 > /tmp/hmo-next.log 2>&1 &
          echo $! > /tmp/hmo-next.pid
      - name: Wait for production server
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hmo-next.log
          exit 1
      - name: Verify pages render
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q "HMO Vision AI"
          curl --fail --silent --show-error http://127.0.0.1:3000/new > /tmp/new.html
          grep -q "Analyse a Property" /tmp/new.html
          grep -q "Upload Floor Plan" /tmp/new.html
          grep -q "Analyse Floor Plan" /tmp/new.html
      - name: Verify /new is not cacheable
        run: |
          curl --fail --silent --show-error -D /tmp/new.headers -o /dev/null http://127.0.0.1:3000/new
          grep -qi "cache-control: no-store, no-cache" /tmp/new.headers
          grep -qi "pragma: no-cache" /tmp/new.headers
      - name: Verify upload API is reachable
        run: |
          printf 'x' > /tmp/smoke.txt
          status=$(curl --silent --output /tmp/upload.json --write-out "%{http_code}" -X POST -F 'file=@/tmp/smoke.txt;type=text/plain' http://127.0.0.1:3000/api/upload)
          test "$status" = "400"
          grep -Eq 'Unsupported file type|No file uploaded' /tmp/upload.json
      - name: Verify analysis API initializes
        run: |
          status=$(curl --silent --output /tmp/analyse.json --write-out "%{http_code}" -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/analyse)
          test "$status" = "400"
          grep -Eq 'No uploaded file|Invalid uploaded filename|Missing' /tmp/analyse.json
      - name: Verify server remains alive
        run: kill -0 $(cat /tmp/hmo-next.pid)
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hmo-next.log || true
      - name: Stop production server
        if: always()
        run: kill $(cat /tmp/hmo-next.pid) 2>/dev/null || true
