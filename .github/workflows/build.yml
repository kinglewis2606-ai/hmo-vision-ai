# Real reference-floor-plan E2E acceptance test enabled.
name: Build and Runtime Smoke Test

on:
  push:
    branches:
      - main
      - hmo-production
      - hmo-pipeline-v2
      - fix/real-floorplan-pipeline
      - fix/max-hmo-geometry-output
      - hmo-max-conversion
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:geometry
      - name: Test HMO planner property-specific optimisation
        run: |
          rm -rf .hmo-planner-test
          tsc --ignoreConfig tests/hmoPlanner.test.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-planner-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-planner-test/tests/hmoPlanner.test.js
      - name: Test reference-style HMO layout pipeline
        run: |
          rm -rf .hmo-layout-test
          tsc --ignoreConfig tests/hmoLayoutPipeline.test.ts lib/hmoLayoutPipeline.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-layout-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-layout-test/tests/hmoLayoutPipeline.test.js
      - name: Test source-dependent HMO outcome
        run: |
          rm -rf .hmo-source-test
          tsc --ignoreConfig tests/hmoPipelineSmoke.test.ts lib/hmoLayoutPipeline.ts lib/hmoPlanner.ts lib/geometryValidation.ts lib/deterministicGeometryEngine.ts lib/types/floorPlan.ts --outDir .hmo-source-test --rootDir . --module Node16 --moduleResolution Node16 --target es2020 --esModuleInterop --types node --skipLibCheck
          node --test .hmo-source-test/tests/hmoPipelineSmoke.test.js
      - run: npm run build
      - name: Start production server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          nohup npm run start -- -H 127.0.0.1 -p 3000 > /tmp/hmo-next.log 2>&1 &
          echo $! > /tmp/hmo-next.pid
      - name: Wait for production server
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/hmo-next.log
          exit 1
      - name: Verify pages render and deployment versioning is active
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html
          grep -q "HMO Vision AI" /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/new > /tmp/new.html
          grep -q "Analyse a Property" /tmp/new.html
          grep -q "Upload Floor Plan" /tmp/new.html
          grep -q "Analyse Floor Plan" /tmp/new.html
          grep -q "data-dpl-id=\"${GITHUB_SHA}\"" /tmp/home.html
          grep -q "data-dpl-id=\"${GITHUB_SHA}\"" /tmp/new.html
      - name: Verify upload API is reachable
        run: |
          printf 'x' > /tmp/smoke.txt
          status=$(curl --silent --output /tmp/upload.json --write-out "%{http_code}" -X POST -F 'file=@/tmp/smoke.txt;type=text/plain' http://127.0.0.1:3000/api/upload)
          test "$status" = "400"
          grep -Eq 'Unsupported file type|No file uploaded' /tmp/upload.json
      - name: Verify analysis API initializes
        run: |
          status=$(curl --silent --output /tmp/analyse.json --write-out "%{http_code}" -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/analyse)
          test "$status" = "400"
          grep -Eq 'No uploaded file|Invalid uploaded filename|Missing' /tmp/analyse.json
      - name: End-to-end test with reference floor plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          mkdir -p public/uploads
          cp tests/fixtures/reference-floorplan.jpg public/uploads/e2e-reference-floorplan.jpg
          started=$(date +%s)
          status=$(curl --silent --show-error --output /tmp/e2e-analysis.json --write-out "%{http_code}" -X POST -H 'Content-Type: application/json' --data '{"filename":"e2e-reference-floorplan.jpg","address":"E2E reference property","propertyType":"Semi Detached"}' http://127.0.0.1:3000/api/analyse)
          finished=$(date +%s)
          elapsed=$((finished-started))
          test "$status" = "200"
          test "$elapsed" -lt 60
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/e2e-analysis.json','utf8'));
          if (!body.success) throw new Error(body.error || 'E2E analysis returned success=false');
          const r = body.result || {};
          if (!r.originalFloorPlan || !r.proposedFloorPlan) throw new Error('Missing original/proposed floor plans');
          if (!r.generatedLayoutImage) throw new Error('Missing generated proposed-plan rendering');
          const g = r.geometryFeasibility || {};
          if (g.possible !== true) throw new Error('Geometry feasibility was not true');
          if (!Number.isInteger(g.proposedBedrooms) || g.proposedBedrooms < 1) throw new Error('No validated proposed bedrooms');
          if (!Number.isInteger(g.proposedEnsuites) || g.proposedEnsuites < 0) throw new Error('Invalid ensuite count');
          const audit = g.grossAreaAudit || {};
          if (audit.roomGeometryAreaConserved !== true) throw new Error('Gross-area conservation audit failed');
          if (!Array.isArray(r.changes) || !Array.isArray(r.rejectedChanges)) throw new Error('Missing applied/rejected change audit');
          console.log(JSON.stringify({bedrooms:g.proposedBedrooms,ensuites:g.proposedEnsuites,appliedChanges:r.changes.length,rejectedChanges:r.rejectedChanges.length,geometryPossible:g.possible,areaConserved:audit.roomGeometryAreaConserved}, null, 2));
          NODE
      - name: Verify server remains alive
        run: kill -0 $(cat /tmp/hmo-next.pid)
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hmo-next.log || true
      - name: Stop production server
        if: always()
        run: kill $(cat /tmp/hmo-next.pid) 2>/dev/null || true
